[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-classifier"
version = "0.1.0"
description = "Phishing URL classifier fine-tuned from GPT-2 small"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",      
    "numpy",
    "pandas",
    "scikit-learn",   
    "tiktoken",
    "tldextract",     
]

[project.optional-dependencies]
pretrain = ["tensorflow", "requests", "tqdm"]
notebook = ["ipykernel", "matplotlib"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["components*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]